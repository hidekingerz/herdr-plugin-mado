id = "mado.loop-dash"
name = "mado loop dash"
version = "0.1.2"
min_herdr_version = "0.8.0"
description = "Keep an agent loop's state docs (loop/MEMORY.md, VISION.md, ARCHITECTURE.md, RULES.md) on screen in a mado pane that follows the files."
platforms = ["linux", "macos"]

[[actions]]
id = "show"
title = "Show loop state in mado"
contexts = ["pane", "workspace"]
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/loop-dash.sh\""]

[[panes]]
id = "dash"
title = "mado loop dash"
placement = "split"
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/pane.sh\""]
